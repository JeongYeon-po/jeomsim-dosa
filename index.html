<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점(占)심(心)도사</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background: #0d0d0d;
      color: #f5f0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .badge {
      font-size: 12px;
      letter-spacing: 3px;
      color: #a0845c;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    h1 span { color: #c9a96e; }
    .sub {
      font-size: 14px;
      color: #666;
      letter-spacing: 2px;
      margin-bottom: 48px;
    }
    .copy-main {
      font-size: 18px;
      color: #d4b896;
      margin-bottom: 8px;
      font-weight: 300;
    }
    .copy-sub {
      font-size: 13px;
      color: #555;
      margin-bottom: 60px;
    }
    .cta {
      background: #c9a96e;
      color: #0d0d0d;
      border: none;
      padding: 16px 40px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .cta:hover { background: #b8956a; }
    .footer {
      position: absolute;
      bottom: 30px;
      font-size: 11px;
      color: #333;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="badge">AI 운세 · 건강 · 점심 추천</div>
  <h1>점<span>(占)</span>심<span>(心)</span><br>도사</h1>
  <div class="sub">당신의 하루 마음과 몸을 책임져드립니다</div>
  <div class="copy-main">점은 봐줄게. 점심은 덤이야.</div>
  <div class="copy-sub">사주 · MBTI · 건강 상태로 오늘을 꿰뚫는 AI 도사</div>
  <button class="cta" onclick="alert('곧 오픈합니다 🔮')">도사 소환하기</button>
  <div class="footer">점(占)심(心)도사 · AI FORTUNE · 2026</div>
</body>
</html>
